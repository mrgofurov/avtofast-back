# Nginx reverse proxy configuration for https://api.avtofast.uz
# Tuned for high-concurrency Fasthttp/Fiber backend

upstream avtofast_backend {
    server 127.0.0.1:8080;
    keepalive 128;
}

server {
    listen 80;
    server_name api.avtofast.uz;

    # Redirect all plain HTTP traffic to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.avtofast.uz;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/api.avtofast.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.avtofast.uz/privkey.pem;

    # TLS security parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    # Max upload limit (for content and sync payloads)
    client_max_body_size 30M;

    location / {
        proxy_pass http://avtofast_backend;
        proxy_http_version 1.1;

        # Keepalive upstream optimization
        proxy_set_header Connection "";

        # Client IP and header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering settings for low latency
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static media uploads (questions, videos, audios)
    location /uploads/ {
        alias /opt/avtofast/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Lightweight direct health check
    location = /healthz {
        proxy_pass http://avtofast_backend/healthz;
        access_log off;
    }
}
