openapi: 3.1.0
info:
  title: AvtoFast Core API
  version: 1.0.0
  description: High-performance production API contract for AvtoFast learning platform.
servers:
  - url: https://api.avtofast.uz/v1
    description: Production Server
  - url: http://localhost:8080/v1
    description: Local Development Server

paths:
  /auth/session:
    post:
      summary: Exchange a Firebase ID token for an AvtoFast session
      description: >-
        The mobile client signs in through Firebase (Google or Apple) and posts
        the resulting ID token here. Every other authenticated endpoint takes
        the access token this returns, not the Firebase one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
      responses:
        '201':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: The ID token is invalid or expired
        '503':
          description: Sign-in is unavailable or the token could not be verified
  /auth/guest:
    post:
      summary: Start a session for a learner who declined sign-in
      description: >-
        Scoped to one installation. Progress is stored server-side exactly as
        for a signed-in learner, but is tied to the device rather than to an
        account, so it does not survive a reinstall.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                  description: Falls back to the X-Device-Id header when omitted.
      responses:
        '201':
          description: Guest session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: No device id was supplied
  /auth/refresh:
    post:
      summary: Renew an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Session renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: The refresh token is invalid or expired
  /bootstrap:
    get:
      summary: App bootstrap configuration
      responses:
        '200':
          description: Configuration loaded
  /me:
    get:
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User state hydrated
    patch:
      summary: Update avatar/profile metadata
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile updated
    delete:
      summary: Delete the account and all data belonging to it
      description: >-
        Permanent and immediate. Required by App Store Review Guideline
        5.1.1(v). The session token stops working straight away.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Account deleted
  /me/onboarding:
    put:
      summary: Save onboarding state
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Onboarding saved
  /me/preferences:
    patch:
      summary: Update preferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Preferences updated
  /me/notification-preferences:
    get:
      summary: Read notification preferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notification preferences loaded
    patch:
      summary: Update notification preferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notification preferences updated

  /content/packs:
    get:
      summary: Pack catalogue
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pack catalogue
  /content/packs/{packId}/manifest:
    get:
      summary: Signed pack manifest
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pack manifest with Ed25519 signature
  /content/packs/{packId}/questions:
    get:
      summary: Online question bank (correct answers omitted)
      security:
        - BearerAuth: []
      parameters:
        - name: locale
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated questions list
  /content/packs/{packId}/offline-download:
    post:
      summary: Short-lived signed download URL
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Signed download package URL

  /topics:
    get:
      summary: Syllabus topics, their numbered tests and progress through them
      description: >-
        Topics follow the Yo'l harakati qoidalari (one per chapter or appendix
        section, plus first aid and safe driving), listed in syllabus order
        under eight groups; each item carries its title, group, groupTitle and
        the YHQ source it covers. Questions are filed under topics by
        cmd/classify-topics from the clause their official explanation cites.
        Each topic's published questions are cut into fixed slices of
        twenty — questions 1-20 are Test 1, 21-40 are Test 2, and so on over
        the whole bank. A learner who finishes every test in a topic has seen
        every question in it.
      security:
        - BearerAuth: []
      parameters:
        - name: packId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One entry per category with questionCount, testCount and completedTests
  /topics/{category}/tests:
    get:
      summary: One topic's numbered tests, with the learner's best score on each
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          description: >-
            A topic key from GET /topics (e.g. intersections_equal,
            signs_prohibitory, towing). Topics follow the Yo'l harakati
            qoidalari: one per chapter or appendix section.
          schema:
            type: string
        - name: packId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tests in order, each with questionCount, attempts and bestCorrect

  /practice-sessions:
    post:
      summary: Create adaptive/category/mistake practice session
      description: >-
        With `testIndex` and a `category`, returns exactly that numbered test:
        a fixed, repeatable slice, with no mistake-review or random fill.
        Without it, behaviour is unchanged — a random draw of `questionCount`.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Session created with ordered questions
  /practice-sessions/{sessionId}/answers:
    post:
      summary: Submit practice answer
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Answer evaluated, spaced-repetition updated
  /practice-sessions/{sessionId}/complete:
    post:
      summary: Finalize practice session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Score and progress finalized

  /review/mistakes:
    get:
      summary: Scheduled incorrect questions for repeat study
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Mistake review queue

  /mock-exams:
    post:
      summary: Create official format timed mock exam
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Exam created with 20 questions and deadline
    get:
      summary: Paginated exam attempt history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated exam attempts
  /mock-exams/{examId}/answers/{questionId}:
    put:
      summary: Persist in-progress answer
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Answer saved
        '409':
          description: Exam expired or completed
  /mock-exams/{examId}/submit:
    post:
      summary: Submit mock exam for server-grade scoring
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Server graded pass/fail and full review

  /dashboard:
    get:
      summary: Dashboard snapshot
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Compact snapshot
  /analytics/progress:
    get:
      summary: Progress analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Time series and category accuracy

  /sync/events:
    post:
      summary: Idempotent offline event synchronization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Batch event acceptance report
  /sync/changes:
    get:
      summary: Cursor-based changes to merge
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Changes stream

  /entitlements:
    get:
      summary: Premium entitlement status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Entitlement summary
  /billing/verify:
    post:
      summary: Verify store purchase receipt
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verified entitlement
  /billing/restore:
    post:
      summary: Reconcile purchases
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reconciled entitlement
  /devices/{deviceId}/push-token:
    put:
      summary: Register device push token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device token registered

  /ai/tutor:
    post:
      summary: Ask the AI tutor (AI Ustoz)
      description: |
        Answers only from the question bank's official explanations, which cite
        YHQ clauses. When those sources do not cover the question the answer is
        a fixed "not in my sources" text with `grounded: false` and no
        citations. Behind FEATURE_AI_TUTOR; limited to 20 requests a minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  maxLength: 1000
                questionId:
                  type: string
                  description: A question the learner just got wrong; its explanation is always a source.
                selectedChoiceId:
                  type: string
                  description: The choice the learner picked for questionId.
                history:
                  type: array
                  description: Earlier turns of the chat, oldest first; only the last 10 are used.
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      text:
                        type: string
      responses:
        '200':
          description: Tutor answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  grounded:
                    type: boolean
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId:
                          type: string
                        clause:
                          type: string
                          description: The YHQ reference as the explanation writes it; absent when it cites none.
                        text:
                          type: string
                          description: The official explanation, verbatim.
        '400':
          description: Missing message
        '403':
          description: FEATURE_DISABLED
        '502':
          description: AI_FAILED, the model call failed
        '503':
          description: AI_UNAVAILABLE, no API key configured

components:
  schemas:
    Session:
      type: object
      properties:
        accessToken:
          type: string
          description: Bearer token for every authenticated endpoint.
        refreshToken:
          type: string
          description: Presented to /auth/refresh only; never accepted as a bearer token.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
        user:
          type: object
          properties:
            id:
              type: string
              example: usr_01J9ZP4W2C0000000000000000
            displayName:
              type: string
            email:
              type: string
            avatarUrl:
              type: [string, "null"]
            provider:
              type: string
              example: google.com
            isGuest:
              type: boolean
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
