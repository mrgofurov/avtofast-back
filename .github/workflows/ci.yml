name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run Unit & E2E Tests (with Race Detector)
        run: |
          go test -v -race ./...

      - name: Run Performance Benchmarks
        run: |
          go test -bench=. -benchmem ./test/benchmark/...

      - name: Compile Production Binaries
        run: |
          make build
          ls -lh bin/
